# 实验8：混合训练 = 177 张本地标注 + 30 张 DIAS/train（共 207 张），U-Net baseline
data:
  train_image_dir:
    - "C:/Users/13091/Desktop/数据集/dataset1/2~3s/normal"
    - "C:/Users/13091/Desktop/数据集/dataset1/4s/normal"
    - "C:/Users/13091/Desktop/数据集/dataset1/5~6s/normal"
    - "C:/Users/13091/Desktop/数据集/dataset2（4s）/normal"
    - "C:/Users/13091/Desktop/数据集/开源数据集；DIAS/train/images"
  train_mask_dir:
    - "C:/Users/13091/Desktop/数据集/dataset1/2~3s/masks"
    - "C:/Users/13091/Desktop/数据集/dataset1/4s/masks"
    - "C:/Users/13091/Desktop/数据集/dataset1/5~6s/masks"
    - "C:/Users/13091/Desktop/数据集/dataset2（4s）/masks"
    - "C:/Users/13091/Desktop/数据集/开源数据集；DIAS/train/masks"
  val_image_dir: "C:/Users/13091/Desktop/数据集/开源数据集；DIAS/val/images"
  val_mask_dir: "C:/Users/13091/Desktop/数据集/开源数据集；DIAS/val/masks"
  img_size: 512
  num_workers: 0
  pin_memory: true

model:
  name: "unet_baseline"
  in_channels: 1
  out_channels: 1

training:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  use_amp: true

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  dice_smooth: 1.0e-6

checkpoint:
  save_dir: "checkpoints_mixed"
  early_stopping_patience: 15
  save_best_only: true

postprocess:
  min_component_size: 50

visualization:
  output_dir: "results"
  save_overlay: true
