# ══════════════════════════════════════════════════════════════
# 自有数据训练配置（own_train 142 / own_val 35，按 4 个时长子集分层 80/20）
# 数据划分见: C:/Users/13091/Desktop/数据集/own_split/split_record.csv
# ══════════════════════════════════════════════════════════════

# ── 数据路径 ──────────────────────────────────────────────────
data:
  train_image_dir: "C:/Users/13091/Desktop/数据集/own_split/own_train/normal"
  train_mask_dir: "C:/Users/13091/Desktop/数据集/own_split/own_train/masks"
  val_image_dir: "C:/Users/13091/Desktop/数据集/own_split/own_val/normal"
  val_mask_dir: "C:/Users/13091/Desktop/数据集/own_split/own_val/masks"
  img_size: 512                # 统一 Resize 尺寸
  num_workers: 0               # Windows 下建议设为 0，避免多进程僵死
  pin_memory: true

# ── 模型配置 ──────────────────────────────────────────────────
model:
  name: "unet_baseline"        # 可选: unet_baseline, attention_unet
  in_channels: 1
  out_channels: 1

# ── 训练配置 ──────────────────────────────────────────────────
training:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"           # adamw | adam | sgd
  scheduler: "cosine"          # cosine | plateau | step
  use_amp: true                # 自动混合精度（显存不足时必须开启）

# ── 损失函数 ──────────────────────────────────────────────────
loss:
  bce_weight: 0.5
  dice_weight: 0.5
  dice_smooth: 1.0e-6

# ── 早停与模型保存 ────────────────────────────────────────────
checkpoint:
  save_dir: "checkpoints"
  early_stopping_patience: 15  # 验证 Dice 连续无提升的最大轮数
  save_best_only: true

# ── 后处理 ────────────────────────────────────────────────────
postprocess:
  min_component_size: 50       # 连通域去噪的最小像素数阈值

# ── 可视化 ────────────────────────────────────────────────────
visualization:
  output_dir: "results"
  save_overlay: true           # 是否保存 GT vs Pred 叠加对比图
