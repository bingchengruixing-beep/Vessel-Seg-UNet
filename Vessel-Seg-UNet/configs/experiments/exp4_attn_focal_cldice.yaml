# 实验 4: Attention U-Net + Focal Tversky + clDice(组合)
dataset:
  img_size: 512
  num_workers: 0
  pin_memory: true
  keep_aspect_ratio: true
  train_image_dir: "E:/DSCA/image/DSCA/开源数据集；DIAS/train/images"
  train_mask_dir: "E:/DSCA/image/DSCA/开源数据集；DIAS/train/masks"
  val_image_dir: "E:/DSCA/image/DSCA/开源数据集；DIAS/val/images"
  val_mask_dir: "E:/DSCA/image/DSCA/开源数据集；DIAS/val/masks"

model:
  name: attention_unet
  in_channels: 1
  out_channels: 1

training:
  batch_size: 2
  epochs: 80
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  seed: 42
  warmup_epochs: 5
  grad_clip: 1.0
  ema_decay: 0.999
  loss:
    name: FocalTverskyLoss
    bce_weight: 0.5
    dice_weight: 0.5
    dice_smooth: 0.000001
    cl_dice_weight: 0.5
    focal_tversky:
      alpha: 0.7
      beta: 0.3
      gamma: 0.75
  early_stopping:
    patience: 10
  checkpoint:
    save_dir: checkpoints/exp4_attn_focal_cldice
    save_best_only: true
    save_interval: 10

evaluation:
  threshold: 0.5
  apply_postprocess: false

inference:
  threshold: 0.5
  img_size: null
  postprocess:
    enabled: true
    min_component_size: 50
    max_hole_size: 100
    morph_close_kernel: 3
