# 实验 5a: 自有数据基线(UNet + BCEDice, 150 train / 27 val)
dataset:
  img_size: 512
  num_workers: 0
  pin_memory: true
  keep_aspect_ratio: true
  skeleton_size: 256
  train_image_dir: data/train/images
  train_mask_dir: data/train/masks
  val_image_dir: data/val/images
  val_mask_dir: data/val/masks

model:
  name: unet_baseline
  in_channels: 1
  out_channels: 1

training:
  batch_size: 4
  epochs: 80
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  seed: 42
  warmup_epochs: 5
  grad_clip: 1.0
  ema_decay: 0.999
  loss:
    name: BCEDiceLoss
    bce_weight: 0.5
    dice_weight: 0.5
    dice_smooth: 0.000001
    cl_dice_weight: 0.0
  early_stopping:
    patience: 10
  checkpoint:
    save_dir: checkpoints/exp5_own_baseline
    save_best_only: true
    save_interval: 10

evaluation:
  threshold: 0.5
  apply_postprocess: false

inference:
  threshold: 0.5
  img_size: null
  postprocess:
    enabled: true
    min_component_size: 10
    max_hole_size: 100
    morph_close_kernel: 3
