dataset:
  img_size: 512
  num_workers: 0
  pin_memory: true
  keep_aspect_ratio: true
  augmentation:
    elastic_transform: false
  patch:
    enabled: false
    size: 640
    foreground_probability: 0.7
    min_foreground_ratio: 0.002
  train_image_dir: D:\STUDYPOWER\1大创\数据集-标注完成\统一训练集\normal
  train_mask_dir: D:\STUDYPOWER\1大创\数据集-标注完成\统一训练集\masks
  val_image_dir: D:\STUDYPOWER\1大创\数据集-标注完成\开源数据集；DIAS\val\images
  val_mask_dir: D:\STUDYPOWER\1大创\数据集-标注完成\开源数据集；DIAS\val\masks
model:
  name: attention_unet
  in_channels: 1
  out_channels: 1
  encoder_name: resnet34
  pretrained: true
  deep_supervision: true
training:
  batch_size: 1
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  seed: 42
  warmup_epochs: 5
  grad_clip: 1.0
  ema_decay: 0.999
  loss:
    name: BCEDiceLoss
    bce_weight: 0.5
    dice_weight: 0.5
    dice_smooth: 1.0e-06
    cl_dice_weight: 0
    cldice_weight: 0
    skeleton_iterations: 5
    focal_tversky:
      alpha: 0.7
      beta: 0.3
      gamma: 0.75
  early_stopping:
    patience: 10
  checkpoint:
    save_dir: checkpoints
    save_best_only: true
    save_interval: 10
  deep_supervision_weights:
  - 0.3
  - 0.2
evaluation:
  threshold: 0.5
  apply_postprocess: false
inference:
  threshold: 0.5
  img_size: null
  patch:
    enabled: false
    size: 640
    stride: 480
  postprocess:
    enabled: true
    min_component_size: 50
    max_hole_size: 100
    morph_close_kernel: 3
