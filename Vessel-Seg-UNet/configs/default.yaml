dataset:
  img_size: 512
  num_workers: 4
  pin_memory: true
  keep_aspect_ratio: true
  train_image_dir: C:\Users\12751\Downloads\DSCA数据集-已整合\dataset2（4s）\normal
  train_mask_dir: C:\Users\12751\Downloads\DSCA数据集-已整合\dataset2（4s）\masks
  val_image_dir: C:/Users/12751/Downloads/DSCA数据集-已整合/开源数据集；DIAS/train/images
  val_mask_dir: C:/Users/12751/Downloads/DSCA数据集-已整合/开源数据集；DIAS/train/masks
model:
  name: attention_unet
  in_channels: 1
  out_channels: 1
training:
  batch_size: 6
  epochs: 150
  learning_rate: 0.00015
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  loss:
    name: BCEDiceLoss
    bce_weight: 0.25
    dice_weight: 0.75
    dice_smooth: 1.0e-06
  early_stopping:
    patience: 10
  checkpoint:
    save_dir: checkpoints
    save_best_only: false
    save_interval: 10
evaluation:
  threshold: 0.5
  apply_postprocess: false
inference:
  threshold: 0.5
  img_size: null
  postprocess:
    enabled: true
    min_component_size: 50
    max_hole_size: 100
    morph_close_kernel: 3
