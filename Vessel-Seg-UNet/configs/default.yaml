dataset:
  img_size: 1024
  num_workers: 0
  pin_memory: true
  keep_aspect_ratio: false
  augmentation:
    elastic_transform: false
  train_image_dir: ../../数据集-标注完成/统一训练集/normal
  train_mask_dir: ../../数据集-标注完成/统一训练集/masks
  val_image_dir: ../../数据集-标注完成/开源数据集；DIAS/val/images
  val_mask_dir: ../../数据集-标注完成/开源数据集；DIAS/val/masks
model:
  name: unet_baseline
  in_channels: 1
  out_channels: 1
  encoder_name: resnet34
  pretrained: true
  deep_supervision: true
training:
  batch_size: 1
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  loss:
    name: BCEDiceLoss
    bce_weight: 0.5
    dice_weight: 0.5
    cldice_weight: 0
    dice_smooth: 1.0e-06
    skeleton_iterations: 5
  deep_supervision_weights:
  - 0.3
  - 0.2
  early_stopping:
    patience: 10
  checkpoint:
    save_dir: checkpoints
    save_best_only: true
    save_interval: 10
evaluation:
  threshold: 0.5
  apply_postprocess: false
inference:
  threshold: 0.5
  img_size: null
  postprocess:
    enabled: true
    min_component_size: 50
    max_hole_size: 100
    morph_close_kernel: 3
