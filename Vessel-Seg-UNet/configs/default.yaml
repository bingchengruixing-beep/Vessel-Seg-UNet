# All paths are relative to the project root unless they are absolute data paths.
dataset:
  img_size: 512
  num_workers: 0
  pin_memory: true
  keep_aspect_ratio: true
  train_image_dir: data/train/images
  train_mask_dir: data/train/masks
  val_image_dir: data/val/images
  val_mask_dir: data/val/masks

model:
  name: unet_baseline
  in_channels: 1
  out_channels: 1

training:
  batch_size: 1
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  loss:
    name: BCEDiceLoss
    bce_weight: 0.5
    dice_weight: 0.5
    dice_smooth: 0.000001
  early_stopping:
    patience: 10
  checkpoint:
    # This directory is intentionally restricted to a project-relative location.
    save_dir: checkpoints
    save_best_only: true
    save_interval: 10

evaluation:
  threshold: 0.5
  # Enable this to measure the exact masks produced in deployment.
  apply_postprocess: false

inference:
  threshold: 0.5
  # null inherits dataset.img_size, which avoids a silent training/inference mismatch.
  img_size: null
  postprocess:
    enabled: true
    min_component_size: 50
    max_hole_size: 100
    morph_close_kernel: 3
